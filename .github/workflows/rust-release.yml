name: Rust release

# Push a tag rust-v<version> (matching [workspace.package] version in rust/Cargo.toml) to
# publish a GitHub Release with the Windows and Linux binaries. The converter's
# "Check for updates" looks for exactly these tags and asset names.
#
#   git tag rust-v1.1.0 && git push origin rust-v1.1.0

on:
  push:
    tags: ["rust-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (rust-v<version>); it must already exist"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Tag matches the Cargo version
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' rust/Cargo.toml)
          if [ "rust-v$cargo_version" != "$tag" ]; then
            echo "::error::Tag $tag does not match rust/Cargo.toml version $cargo_version"
            exit 1
          fi

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace
      - run: cargo build --release -p habbo-app
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/habbo-downloader.exe out/habbo-downloader-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: rust/out/

  linux:
    name: Linux x64
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace
      - run: cargo build --release -p habbo-app
      - name: Package
        run: |
          mkdir -p out
          cp target/release/habbo-downloader out/habbo-downloader-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: rust/out/

  release:
    name: Publish release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add config.ini
        run: cp rust/crates/core/assets/default_config.ini dist/config.ini
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: All-in-1 Converter (Rust) ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/habbo-downloader-windows-x64.exe
            dist/habbo-downloader-linux-x64
            dist/config.ini
