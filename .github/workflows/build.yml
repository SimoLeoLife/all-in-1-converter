name: Build

# Validation builds for pull requests and manual dispatch only.
# Push to main goes through Release (which builds AND publishes).
# This workflow compiles + publishes to a temp folder and runs the unit tests,
# so a PR that breaks the cross-platform build or a test is caught before a
# maintainer merges it.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Installs the SDK pinned in global.json, so the two can't drift apart.
          global-json-file: global.json
      - name: Test
        run: dotnet test "SourceCode.Tests/Habbo Downloader.Tests.csproj" -c Release --logger "console;verbosity=normal"

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Installs the SDK pinned in global.json, so the two can't drift apart.
          global-json-file: global.json
      - name: Publish win-x64 (verify)
        working-directory: SourceCode
        run: |
          dotnet publish "Habbo Downloader.csproj" `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:DebugSymbols=false `
            -o ../publish/win-x64

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Installs the SDK pinned in global.json, so the two can't drift apart.
          global-json-file: global.json
      - name: Publish linux-x64 (verify)
        working-directory: SourceCode
        run: |
          dotnet publish "Habbo Downloader.csproj" \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none -p:DebugSymbols=false \
            -o ../publish/linux-x64
